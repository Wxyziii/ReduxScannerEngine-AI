[project]
name = "redux-maker-ai"
version = "1.0.0"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
classifier-runtime = ["torch>=2.6", "transformers>=4.49", "onnxruntime>=1.20", "numpy>=2"]
image-runtime = ["torch>=2.6", "diffusers>=0.32", "transformers>=4.49", "accelerate>=1", "Pillow>=11"]
vision-runtime = ["torch>=2.6", "transformers>=4.49", "accelerate>=1", "Pillow>=11"]
training = ["torch>=2.6", "transformers>=4.49", "scikit-learn>=1.6", "skl2onnx>=1.18", "onnx>=1.17", "onnxruntime>=1.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
